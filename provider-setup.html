<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickServe | My Listing</title>
    <link rel="icon"
        href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPaP8KUI13uTn8pwSDiXSCJCtoKX53C44Mp8zt8mYWRw&s=10"
        type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/list.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

    <header class="navbar">
        <div class="nav-container">

            <a href="page.html" class="logo">
                <span class="logo-icon"><i class="fa-solid fa-bolt"></i></span>
                <span>Quick<span>Serve</span></span>
            </a>

            <nav class="nav-links">
                <a href="page.html">Home</a>
                <a href="services.html">Services</a>
                <a href="providers.html">Providers</a>
            </nav>

            <div class="nav-actions">
                <a href="login.html" class="login-btn" id="navLoginBtn">
                    <i class="fa-regular fa-user"></i>
                    Login
                </a>
                <a href="provider-dashboard.html" class="nav-cta">
                    <i class="fa-solid fa-gauge"></i>
                    Dashboard
                </a>
            </div>

            <button class="menu-toggle" id="menuToggle">
                <i class="fa-solid fa-bars"></i>
            </button>

        </div>
    </header>

    <main>
        <section class="auth-page">

            <div class="auth-card" style="max-width: 520px;">

                <div class="auth-icon"><i class="fa-solid fa-toolbox"></i></div>

                <h1>My Listing</h1>
                <p class="auth-sub">This is what customers see on the Providers page</p>

                <div class="form-note" id="setupNote"></div>

                <form id="providerSetupForm">

                    <div class="form-group">
                        <label>Service Category</label>
                        <select id="serviceSelect" required>
                            <option value="">Select a service...</option>
                        </select>
                        <div class="field-error" id="serviceError">Please select a service.</div>
                    </div>

                    <div class="form-group">
                        <label>Location / City</label>
                        <input type="text" id="locationInput" placeholder="e.g. Karachi" required>
                        <div class="field-error" id="locationError">Location is required.</div>
                    </div>

                    <div class="form-group">
                        <label>Years of Experience</label>
                        <input type="number" id="experienceInput" min="0" placeholder="e.g. 5" required>
                    </div>

                    <div class="form-group">
                        <label>Price (starting from, PKR)</label>
                        <input type="number" id="priceInput" min="0" step="1" placeholder="e.g. 1200" required>
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="descriptionInput" rows="4" placeholder="Tell customers about your service..."
                            required></textarea>
                    </div>

                    <div class="form-group">
                        <label>Listing Photo</label>
                        <input type="file" id="imageInput" accept="image/*">
                        <img id="imagePreview" src="" alt=""
                            style="display:none; margin-top:10px; width:100%; max-height:180px; object-fit:cover; border-radius:12px;">
                    </div>

                    <button type="submit" class="auth-submit" id="saveListingBtn">
                        <i class="fa-solid fa-floppy-disk"></i>
                        Save Listing
                    </button>

                </form>

            </div>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/provider-setup.js"></script>

</body>

</html>
