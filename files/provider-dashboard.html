<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickServe | Provider Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

<header class="navbar">
    <div class="nav-container">

        <a href="index.html" class="logo">
            <span class="logo-icon"><i class="fa-solid fa-bolt"></i></span>
            <span>Quick<span>Serve</span></span>
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="providers.html">Providers</a>
        </nav>

        <div class="nav-actions">
            <a href="login.html" class="login-btn" id="navLoginBtn">
                <i class="fa-regular fa-user"></i>
                Login
            </a>
            <a href="profile.html" class="nav-cta">
                <i class="fa-regular fa-id-badge"></i>
                My Profile
            </a>
        </div>

        <button class="menu-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
        </button>

    </div>
</header>

<main>
<section class="dashboard-page">
    <div class="dashboard-container">

        <div class="dashboard-header">
            <div>
                <h1>Provider Dashboard</h1>
                <p id="welcomeText">Manage your incoming booking requests</p>
            </div>
        </div>

        <div class="form-note show" style="background: rgba(58,167,255,.08); border-color: rgba(58,167,255,.25); color:#3aa7ff;">
            <i class="fa-solid fa-circle-info"></i>
            Bookings are matched to your account by the name you signed up with. Make sure it matches your provider listing name exactly (e.g. "Ayesha Khan").
        </div>

        <div class="dashboard-stats" id="statsRow"></div>

        <div class="booking-list" id="bookingList"></div>

        <div class="empty-state" id="emptyState" style="display:none;">
            <i class="fa-solid fa-inbox"></i>
            <p>No booking requests yet.</p>
        </div>

    </div>
</section>
</main>

<script src="js/auth.js"></script>
<script src="js/provider-dashboard.js"></script>

</body>
</html>
