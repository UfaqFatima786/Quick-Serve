<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickServe | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

<header class="navbar">
    <div class="nav-container">

        <a href="index.html" class="logo">
            <span class="logo-icon"><i class="fa-solid fa-bolt"></i></span>
            <span>Quick<span>Serve</span></span>
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="providers.html">Providers</a>
        </nav>

        <div class="nav-actions">
            <a href="signup.html" class="nav-cta">
                <i class="fa-regular fa-user"></i>
                Create Account
            </a>
        </div>

        <button class="menu-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
        </button>

    </div>
</header>

<main>
<section class="auth-page">

    <div class="auth-card">

        <div class="auth-icon"><i class="fa-solid fa-bolt"></i></div>

        <h1>Welcome Back</h1>
        <p class="auth-sub">Login to book services or manage your bookings</p>

        <div class="form-note" id="loginNote"></div>

        <form id="loginForm">

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="you@example.com" required>
                <div class="field-error" id="emailError">Please enter a valid email.</div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required>
                <div class="field-error" id="passwordError">Password is required.</div>
            </div>

            <button type="submit" class="auth-submit">
                <i class="fa-solid fa-right-to-bracket"></i>
                Login
            </button>

        </form>

        <p class="auth-switch">
            Don't have an account? <a href="signup.html">Sign up</a>
        </p>

    </div>

</section>
</main>

<script src="js/auth.js"></script>
<script src="js/login.js"></script>

</body>
</html>
