<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickServe | Sign Up</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

<header class="navbar">
    <div class="nav-container">

        <a href="index.html" class="logo">
            <span class="logo-icon"><i class="fa-solid fa-bolt"></i></span>
            <span>Quick<span>Serve</span></span>
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="providers.html">Providers</a>
        </nav>

        <div class="nav-actions">
            <a href="login.html" class="login-btn" id="navLoginBtn">
                <i class="fa-regular fa-user"></i>
                Login
            </a>
        </div>

        <button class="menu-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
        </button>

    </div>
</header>

<main>
<section class="auth-page">

    <div class="auth-card">

        <div class="auth-icon"><i class="fa-solid fa-user-plus"></i></div>

        <h1>Create Account</h1>
        <p class="auth-sub">Join QuickServe as a customer or a service provider</p>

        <div class="form-note" id="signupNote"></div>

        <div class="role-toggle">
            <button type="button" class="active" data-role="customer" id="roleCustomerBtn">
                <i class="fa-solid fa-user"></i> Customer
            </button>
            <button type="button" data-role="provider" id="roleProviderBtn">
                <i class="fa-solid fa-toolbox"></i> Provider
            </button>
        </div>

        <form id="signupForm">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signupName" placeholder="Enter your full name" required>
                <div class="field-error" id="nameError">Name is required.</div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="signupEmail" placeholder="you@example.com" required>
                <div class="field-error" id="signupEmailError">Please enter a valid email.</div>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="signupPhone" placeholder="03XX XXXXXXX" required>
                <div class="field-error" id="phoneError">Please enter a valid phone number.</div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="At least 6 characters" required>
                <div class="field-error" id="signupPasswordError">Password must be at least 6 characters.</div>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="signupConfirmPassword" placeholder="Re-enter your password" required>
                <div class="field-error" id="confirmPasswordError">Passwords do not match.</div>
            </div>

            <button type="submit" class="auth-submit">
                <i class="fa-solid fa-user-plus"></i>
                Create Account
            </button>

        </form>

        <p class="auth-switch">
            Already have an account? <a href="login.html">Login</a>
        </p>

    </div>

</section>
</main>

<script src="js/auth.js"></script>
<script src="js/signup.js"></script>

</body>
</html>
